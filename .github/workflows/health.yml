name: health check

on:  
  schedule:    
    - cron: "30 2,8,14,20 * * *"  
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:  
  health-check:    
    runs-on: ubuntu-latest 
    # Ensure GitHub Actions has explicit permission to push to the repo   
    permissions:
      contents: write
      
    steps:      
      - name: Checkout        
        uses: actions/checkout@v4        
        with:
          ref: default
          fetch-depth: 0      
          
      - name: Install FFmpeg        
        run: |          
          sudo apt-get update          
          sudo apt-get install ffmpeg -y      
          
      - name: Run health.sh        
        run: bash health.sh      
        
      - name: Sync with remote to prevent push rejection
        run: |
          # Automatically stashes readme.md changes, pulls any new background commits, and pops the changes back
          git pull origin default --rebase --autostash
          
      - name: Update log        
        uses: stefanzweifel/git-auto-commit-action@v6        
        with:          
          commit_message: "health log"          
          file_pattern: "readme.md"          
          commit_author: "GitHub Actions Bot <actions@github.com>"          
          commit_user_name: "GitHub Actions Bot"          
          commit_user_email: "actions@github.com"
