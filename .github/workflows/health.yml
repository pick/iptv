name: health check

on:  
  schedule:    
    - cron: "30 2,8,14,20 * * *"  
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:  
  health-check:    
    runs-on: ubuntu-latest    
    steps:      
      - name: Checkout        
        uses: actions/checkout@v4        
        with:
          ref: default # Explicitly check out the branch, not a detached HEAD
          fetch-depth: 0      
          
      - name: Install FFmpeg        
        run: |          
          sudo apt-get update          
          sudo apt-get install ffmpeg -y      
          
      - name: Run health.sh        
        run: bash health.sh      
        
      - name: Commit, Rebase, and Push
        run: |
          # 1. Set up the bot identity
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          
          # 2. Stage the file
          git add readme.md
          
          # 3. Only attempt to commit and push if there are actual changes
          if ! git diff --cached --quiet; then
            # Commit the changes locally FIRST
            git commit -m "health log"
            
            # Pull the absolute latest changes from remote and stack our commit on top
            git pull origin default --rebase
            
            # Push the perfectly synced history back to GitHub
            git push origin default
          else
            echo "No changes detected in readme.md. Skipping commit."
          fi
