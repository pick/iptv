name: health check

on:  
  schedule:    
    - cron: "30 2,8,14,20 * * *"  
  workflow_dispatch:

# FIX 1: Prevent multiple jobs from running at the exact same time
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:  
  health-check:    
    runs-on: ubuntu-latest    
    steps:      
      - name: Checkout        
        uses: actions/checkout@v4        
        with:          
          fetch-depth: 0      
          
      - name: Install FFmpeg        
        run: |          
          sudo apt-get update          
          sudo apt-get install ffmpeg -y      
          
      - name: Run health.sh        
        run: bash health.sh      
        
      # FIX 2: Pull any new commits that happened while health.sh was running
      - name: Pull latest changes
        run: git pull origin default --rebase
          
      - name: Update log        
        uses: stefanzweifel/git-auto-commit-action@v6        
        with:          
          commit_message: "health log"          
          file_pattern: "readme.md"          
          commit_author: "GitHub Actions Bot <actions@github.com>"          
          commit_user_name: "GitHub Actions Bot"          
          commit_user_email: "actions@github.com"
