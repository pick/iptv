name: health check

on:  
  schedule:    
    - cron: "30 2,8,14,20 * * *"  
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:  
  health-check:    
    runs-on: ubuntu-latest    
    permissions:
      contents: write

    steps:      
      - name: Checkout        
        uses: actions/checkout@v4        
        with:
          ref: default
          fetch-depth: 0      
          
      - name: Install FFmpeg        
        run: |          
          sudo apt-get update          
          sudo apt-get install ffmpeg -y      
          
      - name: Run health.sh        
        run: bash health.sh      
        
      - name: Aggressive Commit and Push Loop
        run: |
          # 1. Setup Git Bot
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          
          # 2. Stage the file
          git add readme.md
          
          # 3. Only commit if there are actual changes
          if git diff --cached --quiet; then
            echo "No changes in readme.md detected. Skipping."
            exit 0
          fi
          
          git commit -m "health log"
          
          # 4. The Loop: Pull and Push until it succeeds (max 5 tries)
          for i in 1 2 3 4 5; do
            # Pull any new background changes and place our commit on top
            git pull origin default --rebase
            
            # Attempt to push
            if git push origin default; then
              echo "✅ Successfully pushed to default branch!"
              exit 0
            fi
            
            echo "⚠️ Remote rejected the push. Retrying ($i/5)..."
            sleep 3
          done
          
          echo "❌ Failed to push after 5 attempts due to extreme repo activity."
          exit 1
